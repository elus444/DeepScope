[pytest]
; So `import main` and `from tests.conftest import ...` both resolve
; regardless of the directory pytest is invoked from.
pythonpath = .
; tests/test_rls_isolation.py makes real network calls (Supabase auth,
; Postgres, Gemini embeddings) -- a genuine outage or hang in any of
; those should fail that one test loudly within a minute, not stall
; the whole suite indefinitely.
timeout = 60
